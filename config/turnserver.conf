# ============================================================================
# turnserver.conf — coturn (fully static musl build) for a Java-launched service
# ============================================================================
#
# Scope of this configuration:
#   * STUN + TURN, authenticated via the TURN REST API only (time-limited
#     shared-secret credentials).
#   * No user database: SQLite / MySQL / PostgreSQL / MongoDB / Redis are not
#     compiled into this build, so the shared secret below is the only
#     credential source.
#   * Transport is plain UDP + TCP only. TLS and DTLS are both OFF — there is no
#     `turns:`/DTLS fallback. (DTLS starts only with the `dtls` directive; TLS
#     only with cert + pkey. Both are absent/blanked in section 3.)
#   * No Prometheus metrics (not compiled in), and no web-admin/CLI — the
#     web-admin needs TLS — unless you explicitly re-enable them.
#
# How the Java service should run it — in the FOREGROUND, never daemonized
# (the JVM owns the process handle and sends SIGTERM on shutdown):
#
#     turnserver -c /path/to/turnserver.conf
#
# The config path passed with -c may be any private temporary location; coturn
# resolves relative cert/pkey paths against the config file's directory.
#
# Boolean options: '0/off/no/false/f' or '1/on/yes/true/t'; a lone option name
# means "true".
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Authentication — TURN REST API
# ----------------------------------------------------------------------------
# Enables the TURN REST API. Per coturn, `use-auth-secret` internally enables
# the long-term credential mechanism, so do NOT also set `lt-cred-mech` (the two
# mechanisms are mutually exclusive; coturn warns about it).
#
# The client is expected to present:
#     username = "<unix-timestamp>"   or   "<unix-timestamp>:<user-id>"
#     password = base64( HMAC-SHA1( static-auth-secret, username ) )
use-auth-secret

# Shared secret used to mint credentials. Must be a long random value and must
# be identical to what your Java/web layer uses to sign credentials.
# This file contains it in cleartext — keep the file mode 0600.
#
# Deliberately NOT set here. coturn ADDS every static-auth-secret line to a list
# of accepted secrets rather than replacing the previous one, so a placeholder
# left in this file would stay a valid secret next to the real one - and anyone
# who has read this file could mint credentials. The Boson TURN service writes
# its own secret into the config it renders; set one by hand only when running
# turnserver directly.
#static-auth-secret=

# Default realm, also announced to clients. Replace with your own stable value.
realm=turn.example.com

# Separator between timestamp and user-id in the REST username (default ':').
#rest-api-separator=:


# ----------------------------------------------------------------------------
# 2. Listeners and ports
# ----------------------------------------------------------------------------
# STUN + TURN over UDP and TCP (default 3478).
listening-port=3478

# Bind only to specific addresses (optional; default = all system addresses).
# With neither listening-ip nor relay-ip set, coturn uses every system address
# and logs "NO EXPLICIT LISTENER/RELAY ADDRESS(ES)" — that is informational.
#listening-ip=0.0.0.0
#listening-ip=::

# UDP relay endpoint range. The whole range must be reachable by peers; narrow
# it if you port-map inside a container/NAT.
min-port=49152
max-port=65535

# Uncomment to drop a transport entirely. Default UDP and TCP are on; TLS is
# disabled in this file (see section 3).
#no-udp
#no-tcp
#no-tcp-relay                 # disable TCP relaying (RFC 6062)

# Anonymous STUN Binding stays allowed (many ICE clients rely on it). Uncomment
# to require authentication for Binding requests too.
#secure-stun


# ----------------------------------------------------------------------------
# 3. TLS / DTLS — both intentionally DISABLED
# ----------------------------------------------------------------------------
# This deployment relays over plain UDP and TCP only; there is no `turns:`
# (TURN-over-TLS) or DTLS fallback. Rationale: no certificate is provisioned, and
# the media is already end-to-end encrypted by the client (DTLS-SRTP) — TURN
# transport encryption here would only buy firewall traversal via 443.
#
# `no-tls` disables the TLS listener outright.
no-tls

# Blank the default certificate/key filenames. Without this, coturn probes
# turn_server_cert.pem / turn_server_pkey.pem at startup and logs "file not found"
# warnings even when no-tls is set; empty values make it skip that probe.
cert=
pkey=

# DTLS starts only when the `dtls` directive is present — it is absent, so off.
#dtls

# --- If you ever want the 443 traversal fallback ----------------------------
# Comment out `no-tls`, blank out the cert=/pkey= lines above, then set a port
# and real files. (TLS minimum is already TLSv1.2; tlsv1/tlsv1_1 stay off.)
#   tls-listening-port=443
#   cert=/path/to/cert.pem
#   pkey=/path/to/pkey.pem


# ----------------------------------------------------------------------------
# 4. NAT / cloud deployment (optional)
# ----------------------------------------------------------------------------
# If the server sits behind 1:1 NAT, advertise the public address:
#external-ip=203.0.113.10
#external-ip=203.0.113.10/10.0.0.5        # public/private mapping


# ----------------------------------------------------------------------------
# 5. Security hardening
# ----------------------------------------------------------------------------
# Add a FINGERPRINT attribute to responses (recommended for WebRTC).
fingerprint

# Bound the nonce lifetime (seconds) so stale credentials cannot be replayed.
stale-nonce=600

# Refuse relaying to multicast / broadcast peers.
no-multicast-peers

# Do not reveal the coturn version in SOFTWARE attributes (off by default).
#software-attribute

# --- Peer-address filtering -------------------------------------------------
# A reachable TURN server can otherwise be abused to reach hosts the client
# cannot reach directly (SSRF into private networks). Format is a single IP or
# an "IP-IP" range — CIDR is NOT supported.
#
# IMPORTANT: enable this only if your peers are always on public addresses.
# If your clients legitimately relay to private/LAN peers, denying these ranges
# will break them.
#
#denied-peer-ip=0.0.0.0-0.255.255.255
#denied-peer-ip=10.0.0.0-10.255.255.255
#denied-peer-ip=100.64.0.0-100.127.255.255
#denied-peer-ip=127.0.0.0-127.255.255.255
#denied-peer-ip=169.254.0.0-169.254.255.255
#denied-peer-ip=172.16.0.0-172.31.255.255
#denied-peer-ip=192.0.0.0-192.0.255.255
#denied-peer-ip=192.0.2.0-192.0.2.255
#denied-peer-ip=192.168.0.0-192.168.255.255
#denied-peer-ip=198.18.0.0-198.19.255.255
#denied-peer-ip=198.51.100.0-198.51.100.255
#denied-peer-ip=203.0.113.0-203.0.113.255
#denied-peer-ip=240.0.0.0-255.255.255.255
#denied-peer-ip=::1
#denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
#denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
#denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Optional per-user / total allocation quotas (0 = unlimited):
#user-quota=0
#total-quota=0


# ----------------------------------------------------------------------------
# 6. Logging — stream to stdout so the Java supervisor can capture it
# ----------------------------------------------------------------------------
log-file=stdout
simple-log
log-min-level=info
#verbose                     # per-session logging (noisy)
#log-binding                 # extra binding/endpoint logs (verbose mode only)


# ----------------------------------------------------------------------------
# 7. Process files and privileges
# ----------------------------------------------------------------------------
# The Java supervisor owns the process, so the pidfile is disabled. (Left at the
# default, coturn tries /var/run/turnserver.pid and falls back to /var/tmp,
# logging warnings.) Set an explicit path if you do want one.
pidfile=

# Drop privileges after binding. Only meaningful when started as root, and the
# account must resolve locally (this musl static build has no NSS/LDAP). Prefer
# starting the process as the target user from Java instead.
#proc-user=nobody
#proc-group=nogroup


# ----------------------------------------------------------------------------
# 8. Management interfaces (both OFF by default, zero external dependency)
# ----------------------------------------------------------------------------
# telnet-style CLI — compiled in, no extra libraries; enable on demand.
#cli
#cli-ip=127.0.0.1
#cli-port=5766
#cli-password=CHANGE_ME      # use an encrypted form in production

# HTTPS web-admin — compiled in (own sockets + OpenSSL, not libmicrohttpd), but it
# requires TLS, which is disabled here (section 3), so it is not usable as
# configured. Re-enable TLS first if you ever want it.
#web-admin
#web-admin-ip=127.0.0.1
#web-admin-port=8080